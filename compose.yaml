version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: chat_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d db"]
      interval: 5s
      timeout: 5s
      retries: 5

  chat-service:
    build: .
    container_name: chat_service
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=db
      - DATABASE_USER=admin
      - DATABASE_PASSWORD=password
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: